<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máy tính</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="may-tinh">
    <div id="man-hinh" class="man-hinh">0</div>

    <div class="ban-phim">
      <button class="nut nut-hanh-dong" data-loai="hanh-dong" data-gia-tri="xoa">C</button>
      <button class="nut nut-hanh-dong" data-loai="hanh-dong" data-gia-tri="doi-dau">+/-</button>
      <button class="nut nut-hanh-dong" data-loai="hanh-dong" data-gia-tri="phan-tram">%</button>
      <button class="nut nut-toan-tu" data-loai="toan-tu" data-gia-tri="/">÷</button>

      <button class="nut nut-so" data-loai="so" data-gia-tri="7">7</button>
      <button class="nut nut-so" data-loai="so" data-gia-tri="8">8</button>
      <button class="nut nut-so" data-loai="so" data-gia-tri="9">9</button>
      <button class="nut nut-toan-tu" data-loai="toan-tu" data-gia-tri="*">×</button>

      <button class="nut nut-so" data-loai="so" data-gia-tri="4">4</button>
      <button class="nut nut-so" data-loai="so" data-gia-tri="5">5</button>
      <button class="nut nut-so" data-loai="so" data-gia-tri="6">6</button>
      <button class="nut nut-toan-tu" data-loai="toan-tu" data-gia-tri="-">−</button>

      <button class="nut nut-so" data-loai="so" data-gia-tri="1">1</button>
      <button class="nut nut-so" data-loai="so" data-gia-tri="2">2</button>
      <button class="nut nut-so" data-loai="so" data-gia-tri="3">3</button>
      <button class="nut nut-toan-tu" data-loai="toan-tu" data-gia-tri="+">+</button>

      <button class="nut nut-so nut-0" data-loai="so" data-gia-tri="0">0</button>
      <button class="nut nut-hanh-dong" data-loai="hanh-dong" data-gia-tri="thap-phan">.</button>
      <button class="nut nut-bang" data-loai="hanh-dong" data-gia-tri="bang">=</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
