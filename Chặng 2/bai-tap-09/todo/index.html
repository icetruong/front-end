<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài tập 09 - Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-app">
    <h1 class="todo-app__title">Việc cần làm</h1>

    <form id="form-them" class="todo-form">
      <input
        name="them-viec"
        type="text"
        id="input-them"
        class="todo-form__input"
        placeholder="Thêm việc mới..."
        autocomplete="off"
      >
      <button type="submit" class="todo-form__submit" aria-label="Thêm việc">+</button>
    </form>

    <div class="todo-toolbar">
      <div class="todo-filters" role="group" aria-label="Lọc danh sách">
        <button type="button" class="todo-filters__btn is-active" data-filter="tat-ca">Tất cả</button>
        <button type="button" class="todo-filters__btn" data-filter="chua-xong">Chưa xong</button>
        <button type="button" class="todo-filters__btn" data-filter="da-xong">Đã xong</button>
      </div>

      <label class="todo-toolbar__all">
        <input type="checkbox" id="checkbox-tat-ca">
        Đánh dấu tất cả
      </label>
    </div>

    <!--
      Danh sách được render bằng JS. Mỗi <li> nên có:
      - data-id="<id>"
      - input[type=checkbox][data-hanh-dong="xong"]
      - span.todo-item__noi-dung (dùng textContent, KHÔNG innerHTML)
      - button[data-hanh-dong="sua"], button[data-hanh-dong="xoa"]
      - thuộc tính draggable="true" cho yêu cầu kéo thả (nâng cao)
    -->
    <ul id="danh-sach" class="todo-list" aria-live="polite"></ul>

    <p id="thong-bao-rong" class="todo-empty" hidden></p>

    <footer class="todo-footer">
      <span id="dem-so-luong" class="todo-footer__count" aria-live="polite"></span>
      <button type="button" id="nut-xoa-xong" class="todo-footer__clear">Xóa đã xong</button>
    </footer>
  </main>

  <div id="hoan-tac" class="undo-toast" hidden aria-live="polite">
    <span id="hoan-tac-noi-dung"></span>
    <button type="button" id="nut-hoan-tac" class="undo-toast__btn">Hoàn tác</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
